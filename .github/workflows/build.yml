name: Build

# CI only. Releases are cut by the "Release" workflow (manual, from the Actions tab).

on:
  push:
    branches: [ main ]
    paths:
      - 'Emptor/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'Emptor/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile dalamud.zip
          $dest = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path dalamud.zip -DestinationPath $dest -Force

      - name: Build
        run: dotnet build Emptor/Emptor.csproj -c Release --nologo

      - name: Package
        shell: pwsh
        run: |
          $out = "Emptor/bin/Release/Emptor"
          if (-not (Test-Path "$out/latest.zip")) { throw "DalamudPackager did not produce latest.zip" }
          Copy-Item "$out/latest.zip"  "Emptor.zip"  -Force
          Copy-Item "$out/Emptor.json" "Emptor.json" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Emptor
          path: |
            Emptor.zip
            Emptor.json
