name: Release

# Manual: Actions tab -> Release -> Run workflow.
# Bumps the version in Emptor.csproj, builds, tags, and publishes a GitHub Release
# with Emptor.zip + Emptor.json attached. The DalamudPlugins repo's sync job then
# picks up the new version.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to bump'
        type: choice
        default: patch
        options: [ patch, minor, major ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bump version
        id: bump
        shell: pwsh
        run: |
          $csproj = 'Emptor/Emptor.csproj'
          $text = Get-Content $csproj -Raw
          if ($text -notmatch '<Version>([\d.]+)</Version>') { throw 'No <Version> in Emptor.csproj' }
          $cur = [version]$Matches[1]
          $b = if ($cur.Build   -lt 0) { 0 } else { $cur.Build }
          switch ('${{ github.event.inputs.bump }}') {
            'major' { $new = [version]::new($cur.Major + 1, 0, 0, 0) }
            'minor' { $new = [version]::new($cur.Major, $cur.Minor + 1, 0, 0) }
            default { $new = [version]::new($cur.Major, $cur.Minor, $b + 1, 0) }
          }
          $newStr = $new.ToString()
          $text = $text -replace '<Version>[\d.]+</Version>', "<Version>$newStr</Version>"
          Set-Content $csproj $text -NoNewline
          "version=$newStr" >> $env:GITHUB_OUTPUT
          "tag=v$newStr"    >> $env:GITHUB_OUTPUT
          Write-Host "$($cur) -> $newStr"

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile dalamud.zip
          $dest = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path dalamud.zip -DestinationPath $dest -Force

      - name: Build
        run: dotnet build Emptor/Emptor.csproj -c Release --nologo

      - name: Package
        shell: pwsh
        run: |
          $out = 'Emptor/bin/Release/Emptor'
          if (-not (Test-Path "$out/latest.zip")) { throw 'DalamudPackager did not produce latest.zip' }
          Copy-Item "$out/latest.zip"  'Emptor.zip'  -Force
          Copy-Item "$out/Emptor.json" 'Emptor.json' -Force

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Emptor/Emptor.csproj
          git commit -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin main

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          target_commitish: main
          generate_release_notes: true
          files: |
            Emptor.zip
            Emptor.json

      # Optional: push the version straight into Evernow/DalamudPlugins so the
      # plugin is installable immediately. Needs a PAT with contents:write on that
      # repo, stored as the PLUGINMASTER_TOKEN secret. Without it, this no-ops and
      # the DalamudPlugins hourly sync job picks the release up instead.
      - name: Update pluginmaster.json in DalamudPlugins
        env:
          PM_TOKEN: ${{ secrets.PLUGINMASTER_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
          VERSION: ${{ steps.bump.outputs.version }}
        shell: pwsh
        run: |
          if (-not $env:PM_TOKEN) { Write-Host "No PLUGINMASTER_TOKEN secret - skipping (DalamudPlugins sync job will catch up)"; exit 0 }

          $manifest = Get-Content Emptor/bin/Release/Emptor/Emptor.json -Raw | ConvertFrom-Json
          $apiLevel = $manifest.DalamudApiLevel

          git clone --depth 1 "https://x-access-token:$($env:PM_TOKEN)@github.com/Evernow/DalamudPlugins.git" pm
          cd pm
          $master = Get-Content pluginmaster.json -Raw | ConvertFrom-Json
          $entry = $master | Where-Object { $_.InternalName -eq 'Emptor' }
          $dl = "https://github.com/Evernow/Emptor/releases/download/$($env:TAG)/Emptor.zip"
          $entry.AssemblyVersion        = $env:VERSION
          $entry.TestingAssemblyVersion = $env:VERSION
          $entry.DalamudApiLevel        = $apiLevel
          $entry.ApplicableVersion      = "any"
          $entry.LastUpdate             = [int][double]::Parse((Get-Date -UFormat %s))
          $entry.DownloadLinkInstall    = $dl
          $entry.DownloadLinkUpdate     = $dl
          $entry.DownloadLinkTesting    = $dl
          $master | ConvertTo-Json -Depth 10 | Set-Content pluginmaster.json -Encoding UTF8

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host "pluginmaster.json already current"; exit 0 }
          git commit -m "Emptor $($env:VERSION)"
          git push
